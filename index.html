<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demo Payment Scheduler</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.container{
    max-width:850px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
    text-align:center;
}

.warning{
    background:#fff3cd;
    border:1px solid #ffe08a;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    margin-bottom:20px;
}

.row{
    display:grid;
    grid-template-columns:100px 1fr 140px 70px;
    gap:10px;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:15px;
}

button{
    border:0;
    padding:12px 16px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.add{
    background:#e8f0fe;
}

.start{
    background:#16a34a;
    color:white;
}

.stop{
    background:#dc2626;
    color:white;
}

.test{
    background:#7c3aed;
    color:white;
}

.remove{
    background:#fee2e2;
    color:#b91c1c;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

#status{
    margin-top:20px;
    padding:14px;
    background:#f1f5f9;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

#countdown{
    text-align:center;
    margin-top:10px;
    font-size:18px;
}

@media(max-width:650px){

    .row{
        grid-template-columns:1fr;
        padding:15px;
        background:#f8fafc;
        border-radius:12px;
    }

    .remove{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>💰 Demo Payment Scheduler</h1>

<div class="warning">
DEMO / PRANK — NOT A REAL PAYMENT
</div>

<h3>Notifications</h3>

<div id="schedule"></div>

<button class="add" onclick="addRow()">
➕ Add Notification
</button>

<div class="buttons">

<button onclick="allowNotifications()">
🔔 Allow Notifications
</button>

<button class="test" onclick="testVoice()">
🔊 Test Voice
</button>

<button class="start" onclick="startSchedule()">
▶️ Start
</button>

<button class="stop" onclick="stopSchedule()">
⏹️ Stop
</button>

</div>

<div id="status">
Ready
</div>

<div id="countdown">
</div>

</div>
</div>


<script>

/* =================================
   GLOBAL VARIABLES
================================= */

let timers = [];

let running = false;

let startTime = 0;


/* =================================
   DEFAULT ROWS
================================= */

const defaultRows = [

    {
        time:15,
        name:"Prince",
        amount:"3000"
    },

    {
        time:17,
        name:"Nancy",
        amount:"5000"
    },

    {
        time:30,
        name:"Rahul",
        amount:"2000"
    }

];


/* =================================
   ADD ROW
================================= */

function addRow(
    time = "",
    name = "",
    amount = ""
){

    const container =
        document.getElementById("schedule");

    const row =
        document.createElement("div");

    row.className = "row";

    row.innerHTML = `

        <input
            class="time"
            type="number"
            min="0"
            placeholder="Seconds"
            value="${time}"
        >

        <input
            class="name"
            type="text"
            placeholder="Sender name"
            value="${name}"
        >

        <input
            class="amount"
            type="number"
            min="0"
            placeholder="Amount"
            value="${amount}"
        >

        <button
            class="remove"
            onclick="this.parentElement.remove()"
        >
            🗑️
        </button>

    `;

    container.appendChild(row);
}


/* =================================
   LOAD DEFAULTS
================================= */

defaultRows.forEach(item => {

    addRow(
        item.time,
        item.name,
        item.amount
    );

});


/* =================================
   GET SCHEDULE
================================= */

function getSchedule(){

    const rows =
        document.querySelectorAll(".row");

    const schedule = [];

    rows.forEach(row => {

        const time =
            Number(
                row.querySelector(".time").value
            );

        const name =
            row.querySelector(".name").value.trim();

        const amount =
            row.querySelector(".amount").value;

        if(
            !isNaN(time) &&
            time >= 0 &&
            name !== "" &&
            amount !== ""
        ){

            schedule.push({

                time:time,
                name:name,
                amount:amount

            });

        }

    });

    schedule.sort(
        (a,b) => a.time - b.time
    );

    return schedule;
}


/* =================================
   ALLOW NOTIFICATIONS
================================= */

async function allowNotifications(){

    if(
        !("Notification" in window)
    ){

        alert(
            "This browser does not support notifications."
        );

        return;
    }

    const permission =
        await Notification.requestPermission();

    if(permission === "granted"){

        document.getElementById("status")
        .textContent =
        "🔔 Notifications allowed";

    }

    else{

        document.getElementById("status")
        .textContent =
        "❌ Notification permission denied";

    }

}


/* =================================
   SPEECH VOICE
================================= */

function speakPayment(item){

    if(
        !("speechSynthesis" in window)
    ){

        console.log(
            "Speech synthesis not supported"
        );

        return;

    }


    const money =
        Number(item.amount)
        .toLocaleString("en-IN");


    const message =
        money +
        " rupees received from " +
        item.name;


    console.log(
        "Trying to speak:",
        message
    );


    /* Stop previous speech */

    window.speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(
            message
        );


    voice.lang = "en-IN";

    voice.rate = 0.85;

    voice.pitch = 1;

    voice.volume = 1;


    /* Find Indian English voice */

    const voices =
        window.speechSynthesis
        .getVoices();


    const indianVoice =
        voices.find(
            v =>
            v.lang
            .toLowerCase()
            .startsWith("en-in")
        );


    if(indianVoice){

        voice.voice =
            indianVoice;

        console.log(
            "Using voice:",
            indianVoice.name
        );

    }


    voice.onstart = function(){

        document.getElementById(
            "status"
        ).textContent =
        "🔊 Speaking: " +
        message;

    };


    voice.onend = function(){

        document.getElementById(
            "status"
        ).textContent =
        "🔔 Notification sent";

    };


    voice.onerror = function(event){

        console.log(
            "VOICE ERROR:",
            event.error
        );

        document.getElementById(
            "status"
        ).textContent =
        "⚠️ Voice error: " +
        event.error;

    };


    window.speechSynthesis.speak(
        voice
    );

}


/* =================================
   TEST VOICE
================================= */

function testVoice(){

    const testItem = {

        name:"Prince",

        amount:"3000"

    };


    speakPayment(testItem);

}


/* =================================
   LOAD VOICES
================================= */

if(
    "speechSynthesis" in window
){

    window.speechSynthesis
    .addEventListener(
        "voiceschanged",
        function(){

            console.log(
                "Voices loaded:",
                speechSynthesis
                .getVoices()
                .length
            );

        }
    );

}


/* =================================
   SEND NOTIFICATION
================================= */

async function sendNotification(item){

    const registration =
        await navigator
        .serviceWorker
        .ready;


    const money =
        Number(item.amount)
        .toLocaleString("en-IN");


    const body =
        "DEMO / PRANK — NOT A REAL PAYMENT\n\n" +
        "₹" +
        money +
        " received from " +
        item.name;


    await registration
    .showNotification(

        "💰 Demo Payment Received",

        {

            body:body,

            tag:
            "demo-payment-" +
            Date.now(),

            data:{
                demo:true
            }

        }

    );


    /* Speak after notification */

    speakPayment(item);

}


/* =================================
   START SCHEDULE
================================= */

async function startSchedule(){

    if(running){

        return;

    }


    const schedule =
        getSchedule();


    if(schedule.length === 0){

        alert(
            "Please add at least one notification."
        );

        return;

    }


    if(
        !("Notification" in window)
    ){

        alert(
            "Notifications are not supported."
        );

        return;

    }


    if(
        Notification.permission !==
        "granted"
    ){

        const permission =
            await Notification
            .requestPermission();


        if(permission !== "granted"){

            alert(
                "Please allow notifications first."
            );

            return;

        }

    }


    /* Make sure service worker exists */

    try{

        await navigator
        .serviceWorker
        .ready;

    }

    catch(error){

        console.log(error);

    }


    running = true;

    startTime =
        Date.now();


    document.getElementById(
        "status"
    ).textContent =
    "▶️ Schedule running";


    document.getElementById(
        "countdown"
    ).textContent =
    "Waiting for first notification...";


    /* Create timer for every row */

    schedule.forEach(item => {

        const timer =
            setTimeout(

                function(){

                    if(!running){

                        return;

                    }


                    sendNotification(item);


                },

                item.time * 1000

            );


        timers.push(timer);

    });


    /* Countdown */

    updateCountdown(
        schedule
    );

}


/* =================================
   COUNTDOWN
================================= */

function updateCountdown(schedule){

    if(!running){

        return;

    }


    const elapsed =
        (Date.now() - startTime)
        / 1000;


    const remaining =
        schedule
        .filter(
            item =>
            item.time > elapsed
        );


    if(
        remaining.length === 0
    ){

        document.getElementById(
            "countdown"
        ).textContent =
        "✅ All notifications completed";

        running = false;

        return;

    }


    const next =
        remaining[0];


    const seconds =
        Math.ceil(
            next.time - elapsed
        );


    document.getElementById(
        "countdown"
    ).textContent =

    "⏳ Next: " +
    next.name +
    " — ₹" +
    Number(next.amount)
    .toLocaleString("en-IN") +
    " in " +
    seconds +
    " sec";


    setTimeout(
        () => updateCountdown(schedule),
        250
    );

}


/* =================================
   STOP
================================= */

function stopSchedule(){

    timers.forEach(
        timer =>
        clearTimeout(timer)
    );


    timers = [];

    running = false;


    document.getElementById(
        "status"
    ).textContent =
    "⏹️ Schedule stopped";


    document.getElementById(
        "countdown"
    ).textContent =
    "";

}


/* =================================
   SERVICE WORKER
================================= */

if(
    "serviceWorker" in navigator
){

    navigator.serviceWorker
    .register("./sw.js")
    .then(
        registration => {

            console.log(
                "Service Worker registered",
                registration
            );

        }
    )
    .catch(
        error => {

            console.log(
                "Service Worker error:",
                error
            );

        }
    );

}

</script>

</body>
</html>
