<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Demo Payment Notification Simulator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1fa;
  color:#18121f;
}

header{
  background:linear-gradient(135deg,#5b20d6,#843cff);
  color:white;
  padding:30px 20px 70px;
}

.header{
  max-width:520px;
  margin:auto;
}

.badge{
  background:#ffffff30;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.container{
  max-width:520px;
  margin:-40px auto 30px;
  padding:0 16px;
}

.card{
  background:white;
  padding:22px;
  border-radius:24px;
  box-shadow:0 15px 40px #30145c22;
}

.demo{
  background:#fff5d8;
  border:1px solid #f0d27b;
  padding:13px;
  border-radius:14px;
  font-size:13px;
  margin-bottom:18px;
}

.payment{
  text-align:center;
  background:#faf8ff;
  padding:20px;
  border-radius:20px;
}

.tick{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  background:#e8ddff;
  color:#5b20d6;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
}

.amount{
  font-size:38px;
  font-weight:800;
  margin-top:10px;
}

.received{
  font-size:18px;
  font-weight:bold;
}

.preview{
  color:#777;
  margin-top:5px;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd6e8;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:16px;
}

.primary{
  background:#5b20d6;
  color:white;
}

.secondary{
  background:#eee8fa;
  color:#5b20d6;
}

.stop{
  background:#e53935;
  color:white;
  display:none;
}

.status{
  margin-top:16px;
  padding:12px;
  background:#f5f3f7;
  border-radius:12px;
}

.timer{
  text-align:center;
  color:#666;
  margin-top:12px;
}
</style>
</head>

<body>

<header>
<div class="header">

<span class="badge">DEMO / PRANK</span>

<h1>Payment Notification Simulator</h1>

<p>Notification scheduling simulator</p>

</div>
</header>

<main class="container">

<section class="card">

<div class="demo">
⚠️ <b>SIMULATION ONLY</b><br>
These are demo notifications, not real payments.
</div>

<div class="payment">

<div class="tick">✓</div>

<div class="amount" id="amountPreview">
₹5,000
</div>

<div class="received">
Demo Payment Received
</div>

<div class="preview" id="senderPreview">
From: Customer
</div>

</div>


<label>Amount</label>

<input
id="amount"
type="number"
value="5000"
min="1"
>


<label>Sender Name</label>

<input
id="sender"
type="text"
value="Kalu"
>


<label>Notification interval</label>

<input
id="interval"
type="number"
value="15"
min="1"
>


<label>How many notifications?</label>

<input
id="count"
type="number"
value="5"
min="1"
max="100"
>


<button
class="secondary"
id="permission">
🔔 Allow Notifications
</button>


<button
class="primary"
id="start">
▶️ START NOTIFICATIONS
</button>


<button
class="stop"
id="stop">
⏹️ STOP
</button>


<div
class="status"
id="status">
Ready
</div>


<div
class="timer"
id="timer">
No notifications scheduled
</div>

</section>

</main>


<script>

const amount =
document.getElementById("amount");

const sender =
document.getElementById("sender");

const interval =
document.getElementById("interval");

const count =
document.getElementById("count");

const amountPreview =
document.getElementById("amountPreview");

const senderPreview =
document.getElementById("senderPreview");

const permissionButton =
document.getElementById("permission");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const status =
document.getElementById("status");

const timer =
document.getElementById("timer");


let timerID = null;
let countdownID = null;

let running = false;
let sent = 0;
let secondsLeft = 0;


/* ==========================
   PREVIEW
========================== */

function updatePreview(){

  const money =
    Number(amount.value || 0)
    .toLocaleString("en-IN");

  amountPreview.textContent =
    "₹" + money;

  senderPreview.textContent =
    "From: " +
    (sender.value.trim() || "Customer");
}

amount.addEventListener(
  "input",
  updatePreview
);

sender.addEventListener(
  "input",
  updatePreview
);


/* ==========================
   PERMISSION
========================== */

permissionButton.onclick =
async function(){

  if(!("Notification" in window)){

    status.textContent =
      "❌ Notifications are not supported.";

    return;
  }

  const result =
    await Notification.requestPermission();

  if(result === "granted"){

    status.textContent =
      "✅ Notification permission granted.";

  }else{

    status.textContent =
      "❌ Notification permission denied.";
  }
};


/* ==========================
   SEND NOTIFICATION
========================== */

async function sendNotification(){

  if(
    !("Notification" in window)
  ){
    return;
  }

  if(
    Notification.permission !== "granted"
  ){
    status.textContent =
      "❌ Notifications are not allowed.";
    return;
  }

  const money =
    Number(amount.value || 0)
    .toLocaleString("en-IN");

  const person =
    sender.value.trim() ||
    "Customer";


  const title =
    "💰 Demo Payment Received";


  const message =
    "₹" +
    money +
    " received from " +
    person +
    "\n\n" +
    "DEMO / PRANK — NOT A REAL PAYMENT";


  try{

    if("serviceWorker" in navigator){

      const registration =
        await navigator.serviceWorker.ready;

      await registration.showNotification(
        title,
        {
          body:message,

          tag:
            "demo-payment-" +
            Date.now(),

          requireInteraction:false,

          data:{
            demo:true
          }
        }
      );

    }else{

      new Notification(
        title,
        {
          body:message
        }
      );
    }

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ Notification failed.";
  }
}


/* ==========================
   SEND ONE
========================== */

async function sendOne(){

  sent++;

  await sendNotification();

  status.textContent =
    "🟢 Sent notification " +
    sent +
    " of " +
    count.value;
}


/* ==========================
   START
========================== */

async function start(){

  if(running){
    return;
  }


  if(
    !("Notification" in window)
  ){

    status.textContent =
      "❌ Browser notifications unavailable.";

    return;
  }


  if(
    Notification.permission !== "granted"
  ){

    const permission =
      await Notification.requestPermission();

    if(permission !== "granted"){

      status.textContent =
        "❌ Please allow notifications first.";

      return;
    }
  }


  const seconds =
    Math.max(
      1,
      Number(interval.value)
    );


  const total =
    Math.max(
      1,
      Number(count.value)
    );


  running = true;
  sent = 0;


  startButton.style.display =
    "none";

  stopButton.style.display =
    "block";


  /*
    Send first notification immediately.
  */

  await sendOne();


  if(total <= 1){

    stop();

    return;
  }


  secondsLeft = seconds;


  timer.textContent =
    "Next notification in " +
    secondsLeft +
    " seconds";


  /*
    Repeat notification.
  */

  timerID =
    setInterval(
      async function(){

        if(!running){
          return;
        }


        if(sent >= total){

          stop();

          return;
        }


        await sendOne();


        secondsLeft = seconds;

      },
      seconds * 1000
    );


  /*
    Countdown display.
  */

  countdownID =
    setInterval(
      function(){

        if(!running){
          return;
        }


        secondsLeft--;


        if(secondsLeft < 0){
          secondsLeft = 0;
        }


        if(sent >= total){

          timer.textContent =
            "All notifications sent.";

          return;
        }


        timer.textContent =
          "Next notification in " +
          secondsLeft +
          " seconds";

      },
      1000
    );
}


/* ==========================
   STOP
========================== */

function stop(){

  running = false;


  clearInterval(timerID);
  clearInterval(countdownID);


  timerID = null;
  countdownID = null;


  startButton.style.display =
    "block";

  stopButton.style.display =
    "none";


  timer.textContent =
    "Notifications stopped.";


  status.textContent =
    "🔴 Stopped.";
}


stopButton.onclick = stop;


/* ==========================
   SERVICE WORKER
========================== */

if("serviceWorker" in navigator){

  navigator.serviceWorker
    .register("sw.js")
    .then(
      () =>
        console.log(
          "Service worker registered."
        )
    )
    .catch(
      error =>
        console.error(
          "SW error:",
          error
        )
    );
}


/* ==========================
   INITIAL
========================== */

updatePreview();

</script>

</body>
</html>
