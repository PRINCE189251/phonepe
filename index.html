<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demo Notification Scheduler</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1fa;
  color:#18121f;
}

header{
  background:linear-gradient(135deg,#5b20d6,#843cff);
  color:white;
  padding:30px 20px 70px;
}

.header{
  max-width:650px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#ffffff30;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.container{
  max-width:650px;
  margin:-40px auto 30px;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 40px #30145c22;
}

.demo{
  background:#fff5d8;
  border:1px solid #f0d27b;
  padding:14px;
  border-radius:14px;
  font-size:13px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
}

.schedule{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.row{
  background:#faf8ff;
  border:1px solid #e5def0;
  padding:14px;
  border-radius:16px;
}

.row-title{
  font-weight:bold;
  margin-bottom:10px;
  color:#5b20d6;
}

.grid{
  display:grid;
  grid-template-columns:90px 1fr 100px;
  gap:8px;
}

input{
  width:100%;
  padding:11px;
  border:1px solid #ddd6e8;
  border-radius:10px;
  font-size:15px;
}

.remove{
  width:100%;
  background:#ffe5e5;
  color:#d32f2f;
  border:0;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

.add{
  background:#eee8fa;
  color:#5b20d6;
}

button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:14px;
}

.primary{
  background:#5b20d6;
  color:white;
}

.stop{
  background:#e53935;
  color:white;
  display:none;
}

.secondary{
  background:#eee8fa;
  color:#5b20d6;
}

.status{
  margin-top:16px;
  background:#f5f3f7;
  padding:12px;
  border-radius:12px;
  font-size:14px;
}

.timer{
  text-align:center;
  margin-top:10px;
  color:#666;
}

@media(max-width:500px){

  .grid{
    grid-template-columns:80px 1fr;
  }

  .grid input:nth-child(3){
    grid-column:1 / -1;
  }
}
</style>
</head>

<body>

<header>

<div class="header">

<span class="badge">
DEMO / PRANK
</span>

<h1>
Notification Scheduler
</h1>

<p>
Create different demo notifications at different times.
</p>

</div>

</header>


<main class="container">

<section class="card">

<div class="demo">

⚠️ <b>SIMULATION ONLY</b>

<br><br>

These notifications are only a demo/prank simulation.
They are not real payments or bank transactions.

</div>


<h2>
Notification Schedule
</h2>


<div
id="schedule"
class="schedule">
</div>


<button
id="addButton"
class="add">
➕ ADD NOTIFICATION
</button>


<button
id="permissionButton"
class="secondary">
🔔 ALLOW NOTIFICATIONS
</button>


<button
id="startButton"
class="primary">
▶️ START SCHEDULE
</button>


<button
id="stopButton"
class="stop">
⏹️ STOP
</button>


<div
id="status"
class="status">
Ready
</div>


<div
id="timer"
class="timer">
No schedule running
</div>

</section>

</main>


<script>

/* ==========================
   ELEMENTS
========================== */

const schedule =
document.getElementById("schedule");

const addButton =
document.getElementById("addButton");

const permissionButton =
document.getElementById("permissionButton");

const startButton =
document.getElementById("startButton");

const stopButton =
document.getElementById("stopButton");

const status =
document.getElementById("status");

const timer =
document.getElementById("timer");


let running = false;

let scheduledTimers = [];

let countdownTimer = null;

let scheduleRows = [];


/* ==========================
   ADD ROW
========================== */

function addNotification(
  time = 15,
  name = "Prince",
  amount = 3000
){

  const id =
    Date.now() +
    Math.random();


  const row =
    document.createElement("div");

  row.className =
    "row";

  row.dataset.id =
    id;


  row.innerHTML = `

    <div class="row-title">
      Notification ${schedule.children.length + 1}
    </div>

    <div class="grid">

      <input
        class="time"
        type="number"
        min="1"
        value="${time}"
        placeholder="Seconds"
        title="Seconds after START"
      >

      <input
        class="name"
        type="text"
        value="${name}"
        placeholder="Sender name"
      >

      <input
        class="amount"
        type="number"
        min="1"
        value="${amount}"
        placeholder="Amount"
      >

    </div>

    <button
      class="remove"
      type="button">
      🗑 REMOVE
    </button>

  `;


  const remove =
    row.querySelector(".remove");


  remove.onclick =
    function(){

      row.remove();

      renumberRows();

    };


  schedule.appendChild(row);

}


/* ==========================
   RENUMBER
========================== */

function renumberRows(){

  const rows =
    schedule.querySelectorAll(".row");


  rows.forEach(
    (row,index) => {

      row.querySelector(
        ".row-title"
      ).textContent =
        "Notification " +
        (index + 1);

    }
  );

}


/* ==========================
   GET SCHEDULE
========================== */

function getSchedule(){

  const rows =
    schedule.querySelectorAll(".row");

  const data = [];


  rows.forEach(
    row => {

      const time =
        Number(
          row.querySelector(".time").value
        );

      const name =
        row.querySelector(".name")
        .value
        .trim();

      const amount =
        Number(
          row.querySelector(".amount").value
        );


      if(
        time > 0 &&
        name &&
        amount > 0
      ){

        data.push({

          time:time,

          name:name,

          amount:amount

        });

      }

    }
  );


  /*
    Sort by time.
  */

  data.sort(
    (a,b) =>
      a.time - b.time
  );


  return data;
}


/* ==========================
   PERMISSION
========================== */

permissionButton.onclick =
async function(){

  if(
    !("Notification" in window)
  ){

    status.textContent =
      "❌ Notifications are not supported.";

    return;
  }


  const result =
    await Notification.requestPermission();


  if(
    result === "granted"
  ){

    status.textContent =
      "✅ Notifications allowed.";

  }else{

    status.textContent =
      "❌ Notification permission denied.";

  }

};


/* ==========================
   SEND NOTIFICATION
========================== */

async function sendNotification(
  item
){

  if(
    Notification.permission !==
    "granted"
  ){

    return;
  }


  const money =
    Number(item.amount)
    .toLocaleString("en-IN");


  const body =
    "₹" +
    money +
    " demo payment received from " +
    item.name +
    "\n\n" +
    "DEMO / PRANK — NOT A REAL PAYMENT";


  try{

    if(
      "serviceWorker" in navigator
    ){

      const registration =
        await navigator
        .serviceWorker
        .ready;


      await registration.showNotification(

        "💰 Demo Payment Received",

        {

          body:body,

          tag:
            "demo-payment-" +
            Date.now(),

          data:{
            demo:true
          }

        }

      );

    }else{

      new Notification(
        "💰 Demo Payment Received",
        {
          body:body
        }
      );

    }


    status.textContent =
      "🔔 Sent: ₹" +
      money +
      " from " +
      item.name;


  }catch(error){

    console.error(error);

    status.textContent =
      "❌ Notification error.";

  }

}


/* ==========================
   START
========================== */

async function start(){

  if(running){
    return;
  }


  if(
    !("Notification" in window)
  ){

    status.textContent =
      "❌ Notifications unavailable.";

    return;
  }


  if(
    Notification.permission !==
    "granted"
  ){

    const permission =
      await Notification.requestPermission();


    if(
      permission !== "granted"
    ){

      status.textContent =
        "❌ Please allow notifications.";

      return;
    }

  }


  const data =
    getSchedule();


  if(data.length === 0){

    status.textContent =
      "❌ Add at least one notification.";

    return;
  }


  /*
    Start.
  */

  running = true;


  startButton.style.display =
    "none";

  stopButton.style.display =
    "block";


  status.textContent =
    "🟢 Schedule started.";


  /*
    Cancel any old timers.
  */

  scheduledTimers.forEach(
    clearTimeout
  );

  scheduledTimers = [];


  /*
    Find total duration.
  */

  const finalTime =
    data[data.length - 1].time;


  /*
    Create each notification timer.
  */

  data.forEach(
    item => {

      const timerID =
        setTimeout(
          function(){

            if(running){

              sendNotification(item);

            }

          },
          item.time * 1000
        );


      scheduledTimers.push(
        timerID
      );

    }
  );


  /*
    Countdown to next notification.
  */

  let startTime =
    Date.now();


  countdownTimer =
    setInterval(
      function(){

        if(!running){
          return;
        }


        const elapsed =
          (Date.now() - startTime)
          / 1000;


        const remaining =
          data
          .filter(
            item =>
              item.time > elapsed
          );


        if(
          remaining.length === 0
        ){

          timer.textContent =
            "✅ Schedule completed.";

          stop(false);

          return;
        }


        const next =
          remaining[0];


        const seconds =
          Math.ceil(
            next.time - elapsed
          );


        timer.textContent =
          "Next: " +
          next.name +
          " in " +
          seconds +
          " seconds";

      },
      500
    );

}


/* ==========================
   STOP
========================== */

function stop(
  showMessage = true
){

  running = false;


  scheduledTimers.forEach(
    clearTimeout
  );


  scheduledTimers = [];


  clearInterval(
    countdownTimer
  );


  countdownTimer = null;


  startButton.style.display =
    "block";

  stopButton.style.display =
    "none";


  if(showMessage){

    status.textContent =
      "🔴 Schedule stopped.";

    timer.textContent =
      "No schedule running.";

  }

}


/* ==========================
   BUTTONS
========================== */

addButton.onclick =
function(){

  addNotification(
    15,
    "Prince",
    3000
  );

};


startButton.onclick =
start;

stopButton.onclick =
function(){

  stop(true);

};


/* ==========================
   SERVICE WORKER
========================== */

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker
    .register("sw.js")
    .then(
      () =>
        console.log(
          "Service Worker ready"
        )
    )
    .catch(
      error =>
        console.error(error)
    );

}


/* ==========================
   DEFAULT ROWS
========================== */

addNotification(
  15,
  "Prince",
  3000
);

addNotification(
  17,
  "Nancy",
  5000
);

addNotification(
  30,
  "Rahul",
  2000
);

</script>

</body>
</html>
