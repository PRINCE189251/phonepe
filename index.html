<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Prank Simulator</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1fa;
  color:#17121f;
}

.header{
  background:linear-gradient(135deg,#5b20d6,#843cff);
  color:white;
  padding:30px 20px 75px;
}

.header-content{
  max-width:520px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#ffffff30;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

h1{
  margin:12px 0 5px;
}

.container{
  max-width:520px;
  margin:-45px auto 30px;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 40px #30145c22;
}

.demo{
  background:#fff5d8;
  border:1px solid #f0d27b;
  padding:12px;
  border-radius:14px;
  font-size:13px;
  margin-bottom:18px;
}

.payment{
  background:#faf8ff;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.tick{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  background:#e8ddff;
  color:#5b20d6;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
}

.amount{
  font-size:38px;
  font-weight:800;
  margin-top:10px;
}

.received{
  font-size:18px;
  font-weight:bold;
}

.preview{
  color:#777;
  margin-top:5px;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:7px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd6e8;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:16px;
}

.primary{
  background:#5b20d6;
  color:white;
}

.secondary{
  background:#eee8fa;
  color:#5b20d6;
}

.stop{
  background:#e53935;
  color:white;
  display:none;
}

.status{
  margin-top:16px;
  padding:12px;
  background:#f5f3f7;
  border-radius:12px;
  font-size:14px;
}

.timer{
  text-align:center;
  margin-top:12px;
  color:#666;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <span class="badge">DEMO / PRANK</span>
    <h1>Payment Prank Simulator</h1>
    <div>Notification + Voice Announcement</div>
  </div>
</header>

<main class="container">

<section class="card">

<div class="demo">
⚠️ <b>SIMULATION ONLY</b><br>
This is not a real payment or bank transaction.
</div>

<div class="payment">

<div class="tick">✓</div>

<div class="amount" id="amountPreview">₹5,000</div>

<div class="received">
Demo Payment Received
</div>

<div class="preview" id="senderPreview">
From: Customer
</div>

</div>

<label>Amount</label>
<input id="amount" type="number" value="5000" min="1">

<label>Sender</label>
<input id="sender" type="text" value="Customer">

<label>Interval</label>

<select id="interval">
<option value="10000">Every 10 seconds</option>
<option value="30000">Every 30 seconds</option>
<option value="60000">Every 1 minute</option>
<option value="300000">Every 5 minutes</option>
</select>

<label>Voice Language</label>

<select id="language">
<option value="hi-IN">Hindi</option>
<option value="en-IN">English</option>
</select>

<button class="secondary" id="testVoice">
🔊 Test Voice
</button>

<button class="secondary" id="allowNotifications">
🔔 Allow Notifications
</button>

<button class="primary" id="start">
▶️ START VOICE + ALERTS
</button>

<button class="stop" id="stop">
⏹️ STOP
</button>

<div class="status" id="status">
Ready
</div>

<div class="timer" id="timer">
No alerts running
</div>

</section>

</main>

<script>

/* =========================
   ELEMENTS
========================= */

const amount = document.getElementById("amount");
const sender = document.getElementById("sender");
const language = document.getElementById("language");
const interval = document.getElementById("interval");

const amountPreview =
document.getElementById("amountPreview");

const senderPreview =
document.getElementById("senderPreview");

const status =
document.getElementById("status");

const timer =
document.getElementById("timer");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const testVoiceButton =
document.getElementById("testVoice");

const allowNotificationsButton =
document.getElementById("allowNotifications");


let alertInterval = null;
let countdownInterval = null;

let running = false;
let secondsLeft = 0;

/* Prevent overlapping speech */
let speaking = false;


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const money =
        Number(amount.value || 0)
        .toLocaleString("en-IN");

    amountPreview.textContent =
        "₹" + money;

    senderPreview.textContent =
        "From: " +
        (sender.value.trim() || "Customer");
}

amount.addEventListener(
    "input",
    updatePreview
);

sender.addEventListener(
    "input",
    updatePreview
);


/* =========================
   SPEECH TEXT
========================= */

function getSpeechMessage(){

    const money =
        Number(amount.value || 0)
        .toLocaleString("en-IN");

    const person =
        sender.value.trim() || "Customer";

    if(language.value === "hi-IN"){

        return `${person} se ${money} rupaye prapt hue`;

    }

    return `Demo payment received from ${person}. ${money} rupees received`;
}


/* =========================
   LOAD VOICES
========================= */

let availableVoices = [];

function loadVoices(){

    if(!("speechSynthesis" in window)){
        return;
    }

    availableVoices =
        speechSynthesis.getVoices();

    console.log(
        "Available voices:",
        availableVoices
    );
}

loadVoices();

if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        loadVoices;
}


/* =========================
   SELECT VOICE
========================= */

function findVoice(lang){

    if(!availableVoices.length){
        availableVoices =
            speechSynthesis.getVoices();
    }

    /* Exact language */

    let voice =
        availableVoices.find(v =>
            v.lang.toLowerCase() ===
            lang.toLowerCase()
        );

    if(voice){
        return voice;
    }

    /* Same language */

    const base =
        lang.split("-")[0].toLowerCase();

    voice =
        availableVoices.find(v =>
            v.lang.toLowerCase()
            .startsWith(base)
        );

    if(voice){
        return voice;
    }

    /* Hindi fallback */

    if(lang === "hi-IN"){

        voice =
            availableVoices.find(v =>
                v.lang.toLowerCase()
                .startsWith("en")
            );

        if(voice){
            return voice;
        }
    }

    /* Any available voice */

    return availableVoices[0] || null;
}


/* =========================
   SPEAK
========================= */

function speak(){

    if(!("speechSynthesis" in window)){

        status.textContent =
            "❌ Your browser does not support voice.";

        return;
    }

    /*
       Don't start another speech while one
       is already being spoken.
    */

    if(speaking){

        status.textContent =
            "🔊 Voice already playing...";

        return;
    }

    const text =
        getSpeechMessage();

    const utterance =
        new SpeechSynthesisUtterance(text);

    const selectedLanguage =
        language.value;

    utterance.lang =
        selectedLanguage;

    utterance.rate =
        0.85;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    const voice =
        findVoice(selectedLanguage);

    if(voice){

        utterance.voice =
            voice;

        console.log(
            "Using voice:",
            voice.name,
            voice.lang
        );
    }

    speaking = true;

    status.textContent =
        "🔊 Preparing voice...";

    utterance.onstart = function(){

        speaking = true;

        status.textContent =
            "🔊 Speaking: " + text;
    };

    utterance.onend = function(){

        speaking = false;

        status.textContent =
            running
            ? "🟢 Alert system running"
            : "✅ Voice finished";
    };

    utterance.onerror = function(event){

        speaking = false;

        console.error(
            "Speech error:",
            event
        );

        status.textContent =
            "❌ Voice error: " +
            event.error;
    };

    /*
       IMPORTANT:
       No speechSynthesis.cancel() here.
    */

    try{

        speechSynthesis.speak(
            utterance
        );

    }catch(error){

        speaking = false;

        status.textContent =
            "❌ Browser voice error.";

        console.error(error);
    }
}


/* =========================
   TEST VOICE
========================= */

testVoiceButton.addEventListener(
    "click",
    function(){

        /*
           If an old speech is stuck,
           cancel it ONLY when user explicitly
           presses Test Voice.
        */

        if("speechSynthesis" in window){

            speechSynthesis.cancel();

            speaking = false;
        }

        /*
           Small delay gives browser time to
           clear the previous utterance.
        */

        setTimeout(
            function(){

                speak();

            },
            150
        );
    }
);


/* =========================
   NOTIFICATION PERMISSION
========================= */

allowNotificationsButton.addEventListener(
    "click",
    async function(){

        if(!("Notification" in window)){

            status.textContent =
                "❌ Notifications unavailable.";

            return;
        }

        const permission =
            await Notification.requestPermission();

        if(permission === "granted"){

            status.textContent =
                "✅ Notifications allowed.";

        }else{

            status.textContent =
                "❌ Notifications denied.";
        }
    }
);


/* =========================
   NOTIFICATION
========================= */

async function notify(){

    if(
        !("Notification" in window) ||
        Notification.permission !== "granted"
    ){

        return;
    }

    const money =
        Number(amount.value || 0)
        .toLocaleString("en-IN");

    const person =
        sender.value.trim() ||
        "Customer";

    try{

        const registration =
            await navigator.serviceWorker.ready;

        registration.showNotification(
            "💰 Demo Payment Received",
            {

                body:
                `₹${money} received from ${person}\n` +
                `DEMO / PRANK — NOT A REAL PAYMENT`,

                tag:
                "payment-demo-" +
                Date.now(),

                requireInteraction:
                false,

                vibrate:
                [200,100,200]
            }
        );

    }catch(error){

        console.error(
            "Notification error:",
            error
        );
    }
}


/* =========================
   ONE ALERT
========================= */

function paymentAlert(){

    notify();

    /*
       Give notification code a moment,
       then speak.
    */

    setTimeout(
        function(){

            if(running){

                speak();

            }

        },
        100
    );
}


/* =========================
   START
========================= */

async function start(){

    if(running){
        return;
    }

    /*
       Notification permission
    */

    if(
        "Notification" in window &&
        Notification.permission !== "granted"
    ){

        const permission =
            await Notification.requestPermission();

        if(permission !== "granted"){

            status.textContent =
                "❌ Please allow notifications.";

            return;
        }
    }

    /*
       Make sure voices are loaded
    */

    loadVoices();

    running = true;

    startButton.style.display =
        "none";

    stopButton.style.display =
        "block";

    status.textContent =
        "🟢 Starting...";

    /*
       First alert
       This happens directly from
       the Start button interaction.
    */

    paymentAlert();

    secondsLeft =
        Number(interval.value) / 1000;

    timer.textContent =
        "Next alert in " +
        secondsLeft +
        " seconds";


    /* ALERT LOOP */

    alertInterval =
        setInterval(
            function(){

                paymentAlert();

                secondsLeft =
                    Number(interval.value) / 1000;

            },
            Number(interval.value)
        );


    /* COUNTDOWN */

    countdownInterval =
        setInterval(
            function(){

                secondsLeft--;

                if(secondsLeft < 0){

                    secondsLeft = 0;
                }

                timer.textContent =
                    "Next alert in " +
                    secondsLeft +
                    " seconds";

            },
            1000
        );
}


/* =========================
   STOP
========================= */

function stop(){

    running = false;

    clearInterval(
        alertInterval
    );

    clearInterval(
        countdownInterval
    );

    alertInterval = null;
    countdownInterval = null;

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        speaking = false;
    }

    startButton.style.display =
        "block";

    stopButton.style.display =
        "none";

    timer.textContent =
        "No alerts running";

    status.textContent =
        "🔴 Alerts stopped.";
}

startButton.addEventListener(
    "click",
    start
);

stopButton.addEventListener(
    "click",
    stop
);


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

    navigator.serviceWorker
        .register("sw.js")
        .then(function(){

            console.log(
                "Service Worker registered"
            );

        })
        .catch(function(error){

            console.error(
                "Service Worker error:",
                error
            );
        });
}


/* =========================
   INITIALIZE
========================= */

updatePreview();
loadVoices();

</script>

</body>
</html>
