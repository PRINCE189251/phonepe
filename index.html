<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Prank Simulator</title>

<link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f1fa;
  color: #17121f;
}

.header {
  background: linear-gradient(135deg, #5b20d6, #843cff);
  color: white;
  padding: 30px 20px 75px;
}

.header-content {
  max-width: 520px;
  margin: auto;
}

.badge {
  display: inline-block;
  background: #ffffff30;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

h1 {
  margin: 12px 0 5px;
}

.subtitle {
  opacity: .9;
}

.container {
  max-width: 520px;
  margin: -45px auto 30px;
  padding: 0 16px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 15px 40px #30145c22;
}

.demo {
  background: #fff5d8;
  border: 1px solid #f0d27b;
  padding: 12px;
  border-radius: 14px;
  font-size: 13px;
  margin-bottom: 18px;
}

.payment {
  background: #faf8ff;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
}

.tick {
  width: 60px;
  height: 60px;
  margin: auto;
  border-radius: 50%;
  background: #e8ddff;
  color: #5b20d6;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: bold;
}

.amount {
  font-size: 38px;
  font-weight: 800;
  margin-top: 10px;
}

.received {
  font-size: 18px;
  font-weight: bold;
}

.preview {
  color: #777;
  margin-top: 5px;
}

label {
  display: block;
  margin-top: 17px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd6e8;
  border-radius: 12px;
  font-size: 16px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 16px;
}

.primary {
  background: #5b20d6;
  color: white;
}

.secondary {
  background: #eee8fa;
  color: #5b20d6;
}

.stop {
  background: #e53935;
  color: white;
  display: none;
}

.status {
  margin-top: 16px;
  padding: 12px;
  background: #f5f3f7;
  border-radius: 12px;
  font-size: 14px;
}

.timer {
  text-align: center;
  font-size: 14px;
  margin-top: 12px;
  color: #666;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <span class="badge">DEMO / PRANK</span>
    <h1>Payment Prank Simulator</h1>
    <div class="subtitle">
      Notification & voice simulation
    </div>
  </div>
</header>

<main class="container">

<section class="card">

<div class="demo">
  ⚠️ <b>Simulation only</b><br>
  This is not a real payment and does not verify any bank or UPI transaction.
</div>

<div class="payment">

  <div class="tick">✓</div>

  <div class="amount" id="amountPreview">
    ₹5,000
  </div>

  <div class="received">
    Demo Payment Received
  </div>

  <div class="preview" id="senderPreview">
    From: Customer
  </div>

</div>

<label>Amount</label>

<input
  id="amount"
  type="number"
  value="5000"
  min="1"
>

<label>Sender name</label>

<input
  id="sender"
  type="text"
  value="Customer"
>

<label>Interval</label>

<select id="interval">

  <option value="10000">Every 10 seconds</option>
  <option value="30000">Every 30 seconds</option>
  <option value="60000">Every 1 minute</option>
  <option value="300000">Every 5 minutes</option>

</select>

<label>Voice</label>

<select id="language">

  <option value="hi-IN">
    Hindi
  </option>

  <option value="en-IN">
    English
  </option>

</select>

<div class="buttons">

  <button
    class="secondary"
    id="voiceButton">
    🔊 Test Voice
  </button>

  <button
    class="secondary"
    id="notificationButton">
    🔔 Allow Notifications
  </button>

</div>

<button
  class="primary"
  id="startButton">
  ▶️ Start Prank
</button>

<button
  class="stop"
  id="stopButton">
  ⏹️ Stop
</button>

<div class="status" id="status">
  Ready
</div>

<div class="timer" id="timer">
  Alerts are stopped
</div>

</section>

</main>

<script>

const amount = document.getElementById("amount");
const sender = document.getElementById("sender");
const interval = document.getElementById("interval");
const language = document.getElementById("language");

const amountPreview =
  document.getElementById("amountPreview");

const senderPreview =
  document.getElementById("senderPreview");

const status =
  document.getElementById("status");

const timer =
  document.getElementById("timer");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

let alertTimer = null;
let countdownTimer = null;
let remainingSeconds = 0;


/* -------------------------
   PREVIEW
------------------------- */

function getAmount() {

  const value = Number(amount.value || 0);

  return value.toLocaleString("en-IN");

}


function getSender() {

  return sender.value.trim() || "Customer";

}


function updatePreview() {

  amountPreview.textContent =
    "₹" + getAmount();

  senderPreview.textContent =
    "From: " + getSender();

}


amount.addEventListener("input", updatePreview);
sender.addEventListener("input", updatePreview);


/* -------------------------
   MESSAGE
------------------------- */

function getMessage() {

  const money = getAmount();
  const person = getSender();

  if (language.value === "hi-IN") {

    return `${person} से ${money} रुपये प्राप्त हुए`;

  }

  return `Payment received from ${person}. ${money} rupees received`;

}


/* -------------------------
   VOICE
------------------------- */

function speakPayment() {

  if (!("speechSynthesis" in window)) {

    status.textContent =
      "❌ Voice is not supported by this browser.";

    return;

  }

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      getMessage()
    );

  speech.lang = language.value;
  speech.rate = 0.85;
  speech.pitch = 1;

  speechSynthesis.speak(speech);

}


document
  .getElementById("voiceButton")
  .addEventListener(
    "click",
    speakPayment
  );


/* -------------------------
   NOTIFICATIONS
------------------------- */

async function allowNotifications() {

  if (!("Notification" in window)) {

    status.textContent =
      "❌ Notifications are not supported.";

    return false;

  }

  const permission =
    await Notification.requestPermission();

  if (permission === "granted") {

    status.textContent =
      "✅ Notifications allowed.";

    return true;

  }

  status.textContent =
    "❌ Notification permission denied.";

  return false;

}


document
  .getElementById("notificationButton")
  .addEventListener(
    "click",
    allowNotifications
  );


/* -------------------------
   SHOW NOTIFICATION
------------------------- */

async function sendNotification() {

  if (
    !("Notification" in window) ||
    Notification.permission !== "granted"
  ) {

    return;

  }

  const registration =
    await navigator.serviceWorker.ready;

  registration.showNotification(
    "💰 Demo Payment Received",
    {

      body:
        `₹${getAmount()} received from ${getSender()}\n` +
        `⚠️ DEMO / PRANK — NOT A REAL PAYMENT`,

      tag:
        "demo-payment-" + Date.now(),

      vibrate: [
        200,
        100,
        200
      ]

    }
  );

}


/* -------------------------
   ONE ALERT
------------------------- */

function makeAlert() {

  sendNotification();

  /*
    Voice is attempted while the page
    is active. Browsers may block
    automatic speech after some time.
  */

  speakPayment();

}


/* -------------------------
   COUNTDOWN
------------------------- */

function startCountdown() {

  clearInterval(countdownTimer);

  remainingSeconds =
    Number(interval.value) / 1000;

  countdownTimer =
    setInterval(() => {

      remainingSeconds--;

      if (remainingSeconds <= 0) {

        remainingSeconds =
          Number(interval.value) / 1000;

      }

      timer.textContent =
        "Next demo alert in " +
        remainingSeconds +
        " seconds";

    }, 1000);

}


/* -------------------------
   START
------------------------- */

async function startPrank() {

  if ("Notification" in window) {

    if (
      Notification.permission !== "granted"
    ) {

      const allowed =
        await allowNotifications();

      if (!allowed) return;

    }

  }

  if (alertTimer) {

    clearInterval(alertTimer);

  }

  makeAlert();

  alertTimer =
    setInterval(
      makeAlert,
      Number(interval.value)
    );

  startCountdown();

  startButton.style.display =
    "none";

  stopButton.style.display =
    "block";

  status.textContent =
    "🟢 Demo alerts are running.";

}


/* -------------------------
   STOP
------------------------- */

function stopPrank() {

  clearInterval(alertTimer);
  clearInterval(countdownTimer);

  alertTimer = null;

  timer.textContent =
    "Alerts are stopped";

  status.textContent =
    "🔴 Demo alerts stopped.";

  startButton.style.display =
    "block";

  stopButton.style.display =
    "none";

}


startButton.addEventListener(
  "click",
  startPrank
);

stopButton.addEventListener(
  "click",
  stopPrank
);


/* -------------------------
   SERVICE WORKER
------------------------- */

async function registerServiceWorker() {

  if (!("serviceWorker" in navigator)) {

    status.textContent =
      "Service Worker unavailable.";

    return;

  }

  try {

    await navigator.serviceWorker.register(
      "sw.js"
    );

    console.log(
      "Service Worker registered"
    );

  } catch (error) {

    console.error(error);

    status.textContent =
      "Service Worker registration failed.";

  }

}


updatePreview();
registerServiceWorker();

</script>

</body>
</html>
