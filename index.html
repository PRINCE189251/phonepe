<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Prank Simulator</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1fa;
  color:#17121f;
}

.header{
  background:linear-gradient(135deg,#5b20d6,#843cff);
  color:white;
  padding:30px 20px 75px;
}

.header-content{
  max-width:520px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#ffffff30;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

h1{
  margin:12px 0 5px;
}

.container{
  max-width:520px;
  margin:-45px auto 30px;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 40px #30145c22;
}

.demo{
  background:#fff5d8;
  border:1px solid #f0d27b;
  padding:12px;
  border-radius:14px;
  font-size:13px;
  margin-bottom:18px;
}

.payment{
  background:#faf8ff;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.tick{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  background:#e8ddff;
  color:#5b20d6;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
}

.amount{
  font-size:38px;
  font-weight:800;
  margin-top:10px;
}

.received{
  font-size:18px;
  font-weight:bold;
}

.preview{
  color:#777;
  margin-top:5px;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:7px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd6e8;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:16px;
}

.primary{
  background:#5b20d6;
  color:white;
}

.secondary{
  background:#eee8fa;
  color:#5b20d6;
}

.stop{
  background:#e53935;
  color:white;
  display:none;
}

.status{
  margin-top:16px;
  padding:12px;
  background:#f5f3f7;
  border-radius:12px;
  font-size:14px;
}

.timer{
  text-align:center;
  margin-top:12px;
  color:#666;
}
</style>
</head>

<body>

<header class="header">
<div class="header-content">

<span class="badge">
DEMO / PRANK
</span>

<h1>
Payment Prank Simulator
</h1>

<div>
Notification + Voice Announcement
</div>

</div>
</header>

<main class="container">

<section class="card">

<div class="demo">
⚠️ <b>SIMULATION ONLY</b>
<br><br>
This is not a real payment or bank transaction.
</div>

<div class="payment">

<div class="tick">
✓
</div>

<div
class="amount"
id="amountPreview">
₹5,000
</div>

<div class="received">
Demo Payment Received
</div>

<div
class="preview"
id="senderPreview">
From: Customer
</div>

</div>


<label>Amount</label>

<input
id="amount"
type="number"
value="5000"
min="1"
>


<label>Sender Name</label>

<input
id="sender"
type="text"
value="Kalu"
>


<label>Voice Language</label>

<select id="language">

<option value="en-IN">
English
</option>

<option value="hi-IN">
Hindi
</option>

</select>


<label>Interval</label>

<select id="interval">

<option value="10000">
Every 10 seconds
</option>

<option value="30000">
Every 30 seconds
</option>

<option value="60000">
Every 1 minute
</option>

<option value="300000">
Every 5 minutes
</option>

</select>


<button
class="secondary"
id="testVoice">
🔊 TEST VOICE
</button>


<button
class="secondary"
id="allowNotifications">
🔔 ALLOW NOTIFICATIONS
</button>


<button
class="primary"
id="start">
▶️ START ALERTS
</button>


<button
class="stop"
id="stop">
⏹️ STOP
</button>


<div
class="status"
id="status">
Ready
</div>


<div
class="timer"
id="timer">
No alerts running
</div>

</section>

</main>


<script>

/* ==========================
   ELEMENTS
========================== */

const amount =
document.getElementById("amount");

const sender =
document.getElementById("sender");

const language =
document.getElementById("language");

const interval =
document.getElementById("interval");

const amountPreview =
document.getElementById("amountPreview");

const senderPreview =
document.getElementById("senderPreview");

const status =
document.getElementById("status");

const timer =
document.getElementById("timer");

const testVoice =
document.getElementById("testVoice");

const allowNotifications =
document.getElementById("allowNotifications");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");


let alertInterval = null;
let countdownInterval = null;
let running = false;
let secondsLeft = 0;


/* ==========================
   AUDIO
========================== */

let audioContext = null;


function getAudio(){

  if(!audioContext){

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){

      status.textContent =
        "Audio is not supported.";

      return null;
    }

    audioContext =
      new AudioContext();
  }

  if(
    audioContext.state === "suspended"
  ){

    audioContext.resume();
  }

  return audioContext;
}


function beep(){

  const ctx =
    getAudio();

  if(!ctx) return;

  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  oscillator.type =
    "sine";

  oscillator.frequency.value =
    800;

  gain.gain.setValueAtTime(
    0.001,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.25,
    ctx.currentTime + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + 0.5
  );

  oscillator.connect(gain);

  gain.connect(
    ctx.destination
  );

  oscillator.start();

  oscillator.stop(
    ctx.currentTime + 0.5
  );
}


/* ==========================
   SPEECH MESSAGE
========================== */

function getMessage(){

  const money =
    Number(amount.value || 0)
      .toLocaleString("en-IN");

  const name =
    sender.value.trim() ||
    "Customer";


  if(
    language.value === "hi-IN"
  ){

    return (
      name +
      " se " +
      money +
      " rupaye prapt hue"
    );

  }


  return (
    money +
    " rupees received from " +
    name
  );
}


/* ==========================
   SPEAK
========================== */

function speak(){

  if(
    !("speechSynthesis" in window)
  ){

    status.textContent =
      "❌ Speech is not supported.";

    return;
  }


  const message =
    getMessage();


  const voices =
    speechSynthesis.getVoices();


  let selectedVoice = null;


  if(
    language.value === "hi-IN"
  ){

    selectedVoice =
      voices.find(
        v =>
          v.lang
            .toLowerCase()
            .startsWith("hi")
      );

  }else{

    selectedVoice =
      voices.find(
        v =>
          v.lang
            .toLowerCase()
            .startsWith("en-in")
      );

    if(!selectedVoice){

      selectedVoice =
        voices.find(
          v =>
            v.lang
              .toLowerCase()
              .startsWith("en")
        );
    }
  }


  const utterance =
    new SpeechSynthesisUtterance(
      message
    );


  utterance.lang =
    language.value;

  utterance.rate =
    0.9;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  if(selectedVoice){

    utterance.voice =
      selectedVoice;
  }


  utterance.onstart =
    function(){

      status.textContent =
        "🔊 Speaking: " +
        message;
    };


  utterance.onend =
    function(){

      status.textContent =
        running
        ? "🟢 Alert system running"
        : "✅ Voice finished";
    };


  utterance.onerror =
    function(error){

      console.error(
        "Speech error:",
        error
      );

      status.textContent =
        "❌ Voice error: " +
        error.error;
    };


  /*
    Do NOT cancel previous speech here.
    Cancelling was causing the earlier
    'interrupted' problem.
  */

  speechSynthesis.speak(
    utterance
  );
}


/* ==========================
   TEST VOICE
========================== */

testVoice.addEventListener(
  "click",
  function(){

    /*
      First unlock PC audio.
    */

    getAudio();

    beep();


    /*
      Wait a little before speech.
    */

    setTimeout(
      function(){

        speak();

      },
      700
    );

  }
);


/* ==========================
   PREVIEW
========================== */

function updatePreview(){

  const money =
    Number(amount.value || 0)
      .toLocaleString("en-IN");

  amountPreview.textContent =
    "₹" + money;

  senderPreview.textContent =
    "From: " +
    (
      sender.value.trim() ||
      "Customer"
    );
}


amount.addEventListener(
  "input",
  updatePreview
);

sender.addEventListener(
  "input",
  updatePreview
);


/* ==========================
   NOTIFICATIONS
========================== */

allowNotifications.addEventListener(
  "click",
  async function(){

    if(
      !("Notification" in window)
    ){

      status.textContent =
        "❌ Notifications unavailable.";

      return;
    }


    const permission =
      await Notification.requestPermission();


    if(
      permission === "granted"
    ){

      status.textContent =
        "✅ Notifications allowed.";

    }else{

      status.textContent =
        "❌ Notifications denied.";
    }

  }
);


/* ==========================
   NOTIFICATION
========================== */

async function notify(){

  if(
    !("Notification" in window)
  ) return;


  if(
    Notification.permission !==
    "granted"
  ) return;


  const money =
    Number(amount.value || 0)
      .toLocaleString("en-IN");

  const name =
    sender.value.trim() ||
    "Customer";


  try{

    const registration =
      await navigator
        .serviceWorker
        .ready;


    registration.showNotification(
      "💰 Demo Payment Received",
      {

        body:
          "₹" +
          money +
          " received from " +
          name +
          "\n\n" +
          "DEMO / PRANK — NOT A REAL PAYMENT",

        tag:
          "demo-payment-" +
          Date.now()

      }
    );

  }catch(error){

    console.error(error);
  }
}


/* ==========================
   PAYMENT ALERT
========================== */

function paymentAlert(){

  beep();

  notify();

  setTimeout(
    function(){

      speak();

    },
    700
  );
}


/* ==========================
   START
========================== */

async function start(){

  if(running) return;


  /*
    Unlock audio from the
    user's button click.
  */

  getAudio();


  /*
    Notification permission.
  */

  if(
    "Notification" in window &&
    Notification.permission !==
    "granted"
  ){

    const permission =
      await Notification.requestPermission();


    if(
      permission !== "granted"
    ){

      status.textContent =
        "❌ Please allow notifications.";

      return;
    }
  }


  running = true;


  startButton.style.display =
    "none";

  stopButton.style.display =
    "block";


  status.textContent =
    "🟢 Alert system started";


  /*
    First alert.
  */

  paymentAlert();


  secondsLeft =
    Number(interval.value) / 1000;


  timer.textContent =
    "Next alert in " +
    secondsLeft +
    " seconds";


  /*
    Repeat.
  */

  alertInterval =
    setInterval(
      function(){

        paymentAlert();

        secondsLeft =
          Number(interval.value) / 1000;

      },
      Number(interval.value)
    );


  /*
    Countdown.
  */

  countdownInterval =
    setInterval(
      function(){

        secondsLeft--;

        if(secondsLeft < 0){
          secondsLeft = 0;
        }

        timer.textContent =
          "Next alert in " +
          secondsLeft +
          " seconds";

      },
      1000
    );
}


/* ==========================
   STOP
========================== */

function stop(){

  running = false;


  clearInterval(
    alertInterval
  );

  clearInterval(
    countdownInterval
  );


  alertInterval = null;
  countdownInterval = null;


  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();
  }


  startButton.style.display =
    "block";

  stopButton.style.display =
    "none";


  timer.textContent =
    "No alerts running";


  status.textContent =
    "🔴 Alerts stopped.";
}


/* ==========================
   BUTTONS
========================== */

startButton.addEventListener(
  "click",
  start
);

stopButton.addEventListener(
  "click",
  stop
);


/* ==========================
   SERVICE WORKER
========================== */

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker
    .register("sw.js")
    .catch(
      error =>
        console.error(error)
    );
}


/* ==========================
   LOAD VOICES
========================== */

if(
  "speechSynthesis" in window
){

  speechSynthesis.onvoiceschanged =
    function(){

      console.log(
        "Voices loaded:",
        speechSynthesis.getVoices()
      );

    };
}


/* ==========================
   INITIAL
========================== */

updatePreview();

</script>

</body>
</html>
