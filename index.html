<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Prank Simulator</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1fa;
  color:#17121f;
}

.header{
  background:linear-gradient(135deg,#5b20d6,#843cff);
  color:white;
  padding:30px 20px 75px;
}

.header-content{
  max-width:520px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#ffffff30;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

h1{
  margin:12px 0 5px;
}

.container{
  max-width:520px;
  margin:-45px auto 30px;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 40px #30145c22;
}

.demo{
  background:#fff5d8;
  border:1px solid #f0d27b;
  padding:12px;
  border-radius:14px;
  font-size:13px;
  margin-bottom:18px;
}

.payment{
  background:#faf8ff;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.tick{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  background:#e8ddff;
  color:#5b20d6;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
}

.amount{
  font-size:38px;
  font-weight:800;
  margin-top:10px;
}

.received{
  font-size:18px;
  font-weight:bold;
}

.preview{
  color:#777;
  margin-top:5px;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:7px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd6e8;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:16px;
}

.primary{
  background:#5b20d6;
  color:white;
}

.secondary{
  background:#eee8fa;
  color:#5b20d6;
}

.stop{
  background:#e53935;
  color:white;
  display:none;
}

.status{
  margin-top:16px;
  padding:12px;
  background:#f5f3f7;
  border-radius:12px;
  font-size:14px;
}

.timer{
  text-align:center;
  margin-top:12px;
  color:#666;
}

.voice-on{
  background:#e7f7ec;
  color:#16803c;
}
</style>
</head>

<body>

<header class="header">
<div class="header-content">
<span class="badge">DEMO / PRANK</span>
<h1>Payment Prank Simulator</h1>
<div>Notification + Voice Announcement</div>
</div>
</header>

<main class="container">

<section class="card">

<div class="demo">
⚠️ <b>SIMULATION ONLY</b><br>
This is not a real payment or bank transaction.
</div>

<div class="payment">

<div class="tick">✓</div>

<div class="amount" id="amountPreview">₹5,000</div>

<div class="received">
Demo Payment Received
</div>

<div class="preview" id="senderPreview">
From: Customer
</div>

</div>

<label>Amount</label>

<input
id="amount"
type="number"
value="5000"
min="1"
>

<label>Sender</label>

<input
id="sender"
type="text"
value="Customer"
>

<label>Interval</label>

<select id="interval">
<option value="10000">Every 10 seconds</option>
<option value="30000">Every 30 seconds</option>
<option value="60000">Every 1 minute</option>
<option value="300000">Every 5 minutes</option>
</select>

<label>Voice Language</label>

<select id="language">
<option value="hi-IN">Hindi</option>
<option value="en-IN">English</option>
</select>

<button
class="secondary"
id="testVoice">
🔊 Test Voice
</button>

<button
class="secondary"
id="allowNotifications">
🔔 Allow Notifications
</button>

<button
class="primary"
id="start">
▶️ START VOICE + ALERTS
</button>

<button
class="stop"
id="stop">
⏹️ STOP
</button>

<div class="status" id="status">
Ready
</div>

<div class="timer" id="timer">
No alerts running
</div>

</section>

</main>

<script>

const amount =
document.getElementById("amount");

const sender =
document.getElementById("sender");

const language =
document.getElementById("language");

const interval =
document.getElementById("interval");

const amountPreview =
document.getElementById("amountPreview");

const senderPreview =
document.getElementById("senderPreview");

const status =
document.getElementById("status");

const timer =
document.getElementById("timer");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

let alertInterval = null;
let countdownInterval = null;
let running = false;
let secondsLeft = 0;


/* -----------------------------
   PREVIEW
----------------------------- */

function updatePreview(){

  const money =
    Number(amount.value || 0)
    .toLocaleString("en-IN");

  amountPreview.textContent =
    "₹" + money;

  senderPreview.textContent =
    "From: " +
    (sender.value.trim() || "Customer");
}

amount.addEventListener(
  "input",
  updatePreview
);

sender.addEventListener(
  "input",
  updatePreview
);


/* -----------------------------
   MESSAGE
----------------------------- */

function getSpeechMessage(){

  const money =
    Number(amount.value || 0)
    .toLocaleString("en-IN");

  const person =
    sender.value.trim() || "Customer";

  if(language.value === "hi-IN"){

    return `${person} से ${money} रुपये प्राप्त हुए`;

  }

  return `Demo payment received from ${person}. ${money} rupees received`;

}


/* -----------------------------
   FIND VOICE
----------------------------- */

function getBestVoice(lang){

  const voices =
    speechSynthesis.getVoices();

  return (
    voices.find(v =>
      v.lang.toLowerCase() ===
      lang.toLowerCase()
    )
    ||
    voices.find(v =>
      v.lang.toLowerCase()
      .startsWith(lang.split("-")[0])
    )
    ||
    null
  );
}


/* -----------------------------
   VOICE
----------------------------- */

function speak(){

  if(!("speechSynthesis" in window)){

    status.textContent =
      "❌ Speech synthesis is not supported.";

    return;

  }

  speechSynthesis.cancel();

  const text =
    getSpeechMessage();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    language.value;

  utterance.rate =
    0.82;

  utterance.pitch =
    1;

  const voice =
    getBestVoice(language.value);

  if(voice){
    utterance.voice = voice;
  }

  utterance.onstart = () => {

    status.textContent =
      "🔊 Speaking: " + text;

  };

  utterance.onend = () => {

    if(running){

      status.textContent =
        "🟢 Alert system running";

    }

  };

  utterance.onerror = (event) => {

    status.textContent =
      "❌ Voice error: " +
      event.error;

  };

  speechSynthesis.speak(
    utterance
  );

}


/* -----------------------------
   TEST VOICE
----------------------------- */

document
.getElementById("testVoice")
.addEventListener(
  "click",
  () => {

    /*
      User click directly activates
      the browser's speech engine.
    */

    speak();

  }
);


/* -----------------------------
   NOTIFICATION PERMISSION
----------------------------- */

document
.getElementById("allowNotifications")
.addEventListener(
  "click",
  async () => {

    if(!("Notification" in window)){

      status.textContent =
        "❌ Notifications unavailable.";

      return;

    }

    const permission =
      await Notification.requestPermission();

    if(permission === "granted"){

      status.textContent =
        "✅ Notifications allowed.";

    }else{

      status.textContent =
        "❌ Notifications denied.";

    }

  }
);


/* -----------------------------
   NOTIFICATION
----------------------------- */

async function notify(){

  if(
    !("Notification" in window) ||
    Notification.permission !== "granted"
  ){

    return;

  }

  const money =
    Number(amount.value || 0)
    .toLocaleString("en-IN");

  const person =
    sender.value.trim() || "Customer";

  const registration =
    await navigator.serviceWorker.ready;

  registration.showNotification(
    "💰 Demo Payment Received",
    {

      body:
      `₹${money} received from ${person}\n` +
      `DEMO / PRANK — NOT A REAL PAYMENT`,

      tag:
      "payment-demo-" + Date.now(),

      requireInteraction:
      false,

      vibrate:
      [200,100,200]

    }
  );

}


/* -----------------------------
   ONE PAYMENT ALERT
----------------------------- */

function paymentAlert(){

  notify();

  /*
    Speak immediately while page is active.
  */

  speak();

}


/* -----------------------------
   START
----------------------------- */

async function start(){

  if(running) return;

  /*
    Ask notification permission
    directly from the Start click.
  */

  if(
    "Notification" in window &&
    Notification.permission !== "granted"
  ){

    const permission =
      await Notification.requestPermission();

    if(permission !== "granted"){

      status.textContent =
        "❌ Please allow notifications.";

      return;

    }

  }

  /*
    IMPORTANT:
    Speak once directly from the user's
    Start button click. This activates
    the browser's audio session.
  */

  running = true;

  paymentAlert();

  startButton.style.display =
    "none";

  stopButton.style.display =
    "block";

  startButton.classList.add(
    "voice-on"
  );

  secondsLeft =
    Number(interval.value) / 1000;

  timer.textContent =
    "Next alert in " +
    secondsLeft +
    " seconds";

  alertInterval =
    setInterval(
      () => {

        paymentAlert();

        secondsLeft =
          Number(interval.value) / 1000;

      },
      Number(interval.value)
    );

  countdownInterval =
    setInterval(
      () => {

        secondsLeft--;

        if(secondsLeft < 0){

          secondsLeft =
            0;

        }

        timer.textContent =
          "Next alert in " +
          secondsLeft +
          " seconds";

      },
      1000
    );

}


/* -----------------------------
   STOP
----------------------------- */

function stop(){

  running = false;

  clearInterval(
    alertInterval
  );

  clearInterval(
    countdownInterval
  );

  alertInterval = null;
  countdownInterval = null;

  speechSynthesis.cancel();

  startButton.style.display =
    "block";

  stopButton.style.display =
    "none";

  timer.textContent =
    "No alerts running";

  status.textContent =
    "🔴 Alerts stopped.";

}


startButton.addEventListener(
  "click",
  start
);

stopButton.addEventListener(
  "click",
  stop
);


/* -----------------------------
   SERVICE WORKER
----------------------------- */

if("serviceWorker" in navigator){

  navigator.serviceWorker
  .register("sw.js")
  .then(() => {

    console.log(
      "Service Worker registered"
    );

  })
  .catch(error => {

    console.error(
      "Service Worker error:",
      error
    );

  });

}


/* -----------------------------
   LOAD VOICES
----------------------------- */

if("speechSynthesis" in window){

  speechSynthesis.onvoiceschanged =
    () => {

      console.log(
        "Available voices:",
        speechSynthesis.getVoices()
      );

    };

}

updatePreview();

</script>

</body>
</html>
