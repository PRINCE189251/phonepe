<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Payment Prank Simulator</title>

<link rel="manifest" href="manifest.json">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1fa;
  color:#17121f;
}

.header{
  background:linear-gradient(135deg,#5b20d6,#843cff);
  color:white;
  padding:30px 20px 75px;
}

.header-content{
  max-width:520px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#ffffff30;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

  margin:12px 0 5px;
}

.container{

  margin:-45px auto 30px;

}

  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  background:#e8ddff;
  color:#5b20d6;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
}

.amount{
  font-size:38px;
  font-weight:800;
  margin-top:10px;
}

.received{
  font-size:18px;
  font-weight:bold;
}

.preview{

  margin-top:5px;
}

label{

input,
select{

button{

<body>


<header class="header">

<div class="header-content">

<span class="badge">
DEMO / PRANK
</span>

<h1>
Payment Prank Simulator
</h1>

<div>
Notification + Voice Announcement
</div>

</div>

</header>


<main class="container">

<section class="card">


<div class="demo">

⚠️ <b>SIMULATION ONLY</b>

<br>

This is not a real payment or bank transaction.

</div>


<div class="payment">

<div class="tick">
✓
</div>


<div
  class="amount"
  id="amountPreview"
>
₹5,000
</div>


<div class="received">
Demo Payment Received
</div>


<div
  class="preview"
  id="senderPreview"
>
From: Customer
</div>

</div>



<label>
Amount
</label>

<input
  id="amount"
  type="number"
  value="5000"
  min="1"
>



<label>
Sender
</label>

<input
  id="sender"
  type="text"
  value="Customer"
>



<label>
Interval
</label>

<select id="interval">

<option value="10000">
Every 10 seconds
</option>

<option value="30000">
Every 30 seconds
</option>

<option value="60000">
Every 1 minute
</option>

<option value="300000">
Every 5 minutes
</option>

</select>



<label>
Voice Language
</label>

<select id="language">

<option value="hi-IN">
Hindi
</option>

<option value="en-IN">
English
</option>

</select>



<button
  class="secondary"
  id="testVoice"
>
🔊 Test Voice / Audio
</button>



<button
  class="secondary"
  id="allowNotifications"
>
🔔 Allow Notifications
</button>



<button
  class="primary"
  id="start"
>
▶️ START VOICE + ALERTS
</button>



<button
  class="stop"
  id="stop"
>
⏹️ STOP
</button>



<div
  class="status"
  id="status"
>
Ready
</div>



<div
  class="timer"
  id="timer"
>
No alerts running
</div>


</section>

</main>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const amount =
document.getElementById("amount");

const sender =
document.getElementById("sender");

const language =
document.getElementById("language");

const interval =
document.getElementById("interval");

const amountPreview =
document.getElementById("amountPreview");

const senderPreview =
document.getElementById("senderPreview");

const status =
document.getElementById("status");

const timer =
document.getElementById("timer");

const testVoiceButton =
document.getElementById("testVoice");

const allowNotificationsButton =
document.getElementById("allowNotifications");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");


let alertInterval = null;

let countdownInterval = null;

let running = false;

let secondsLeft = 0;


/* =====================================================
   AUDIO SYSTEM
===================================================== */

let audioContext = null;

let audioUnlocked = false;


/* Create browser audio */

function unlockAudio(){

    try{

        if(!audioContext){

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AudioContext){

                status.textContent =
                    "❌ Browser audio is not supported.";

                return false;
            }

            audioContext =
                new AudioContext();
        }


        if(audioContext.state === "suspended"){

            audioContext.resume();

        }


        audioUnlocked = true;

        console.log(
            "Audio state:",
            audioContext.state
        );

        return true;


    }catch(error){

        console.error(
            "Audio error:",
            error
        );

        status.textContent =
            "❌ Could not activate PC audio.";

        return false;
    }
}


/* =====================================================
   TEST AUDIO
===================================================== */

function testAudio(){

    const success =
        unlockAudio();

    if(!success){

        return;
    }


    try{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.value =
            700;


        gain.gain.setValueAtTime(
            0.001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.15,
            audioContext.currentTime + 0.02
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.4
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.4
        );


        status.textContent =
            "✅ PC audio is working.";

    }catch(error){

        console.error(
            error
        );

        status.textContent =
            "❌ Audio test failed.";
    }
}


/* =====================================================
   TEST VOICE
===================================================== */

testVoiceButton.addEventListener(
    "click",
    function(){

        /*
          First activate browser audio.
        */

        testAudio();


        /*
          Then try browser speech.
        */

        setTimeout(
            function(){

                speak();

            },
            500
        );

    }
);


/* =====================================================
   PREVIEW
===================================================== */

function updatePreview(){

    const money =
        Number(
            amount.value || 0
        ).toLocaleString("en-IN");


    amountPreview.textContent =
        "₹" + money;


    senderPreview.textContent =
        "From: " +
        (
            sender.value.trim()
            ||
            "Customer"
        );
}


amount.addEventListener(
    "input",
    updatePreview
);


sender.addEventListener(
    "input",
    updatePreview
);


/* =====================================================
   SPEECH MESSAGE
===================================================== */

function getSpeechMessage(){

    const money =
        Number(
            amount.value || 0
        ).toLocaleString("en-IN");


    const person =
        sender.value.trim()
        ||
        "Customer";


    if(
        language.value === "hi-IN"
    ){

        /*
          Roman Hindi is intentionally used
          because some PC Hindi TTS engines
          fail with Devanagari text.
        */

        return (
            person +
            " se " +
            money +
            " rupaye prapt hue"
        );
    }


    return (
        "Demo payment received from " +
        person +
        ". " +
        money +
        " rupees received"
    );
}


/* =====================================================
   GET AVAILABLE VOICE
===================================================== */

function getVoice(){

    if(
        !("speechSynthesis" in window)
    ){

        return null;
    }


    const voices =
        speechSynthesis.getVoices();


    if(!voices.length){

        return null;
    }


    const wanted =
        language.value.toLowerCase();


    /*
      Exact match
    */

    let voice =
        voices.find(
            function(v){

                return (
                    v.lang.toLowerCase()
                    ===
                    wanted
                );
            }
        );


    if(voice){

        return voice;
    }


    /*
      Same language
    */

    const base =
        wanted.split("-")[0];


    voice =
        voices.find(
            function(v){

                return v.lang
                    .toLowerCase()
                    .startsWith(base);
            }
        );


    if(voice){

        return voice;
    }


    /*
      English fallback
    */

    voice =
        voices.find(
            function(v){

                return v.lang
                    .toLowerCase()
                    .startsWith("en");
            }
        );


    return voice || voices[0];

}


/* =====================================================
   SPEAK
===================================================== */

function speak(){

    if(
        !("speechSynthesis" in window)
    ){

        status.textContent =
            "❌ Speech is not supported.";

        return;
    }


    const text =
        getSpeechMessage();


    /*
      Only cancel if something is
      genuinely stuck.
    */

    if(
        speechSynthesis.speaking ||
        speechSynthesis.pending
    ){

        speechSynthesis.cancel();

    }


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        language.value;


    utterance.rate =
        0.85;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    const voice =
        getVoice();


    if(voice){

        utterance.voice =
            voice;

        console.log(
            "Voice:",
            voice.name,
            voice.lang
        );
    }


    utterance.onstart =
        function(){

            status.textContent =
                "🔊 Speaking: " +
                text;
        };


    utterance.onend =
        function(){

            if(running){

                status.textContent =
                    "🟢 Alert system running";

            }else{

                status.textContent =
                    "✅ Voice finished";
            }
        };


    utterance.onerror =
        function(event){

            console.error(
                "Speech error:",
                event
            );


            status.textContent =
                "❌ Voice error: " +
                event.error;
        };


    try{

        speechSynthesis.speak(
            utterance
        );

    }catch(error){

        console.error(
            error
        );

        status.textContent =
            "❌ Speech could not start.";
    }

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

allowNotificationsButton.addEventListener(
    "click",
    async function(){

        if(
            !("Notification" in window)
        ){

            status.textContent =
                "❌ Notifications are unavailable.";

            return;
        }


        const permission =
            await Notification.requestPermission();


        if(
            permission === "granted"
        ){

            status.textContent =
                "✅ Notifications allowed.";

        }else{

            status.textContent =
                "❌ Notifications denied.";
        }

    }
);


/* =====================================================
   SEND NOTIFICATION
===================================================== */

async function notify(){

    if(
        !("Notification" in window)
    ){

        return;
    }


    if(
        Notification.permission !==
        "granted"
    ){

        return;
    }


    const money =
        Number(
            amount.value || 0
        ).toLocaleString("en-IN");


    const person =
        sender.value.trim()
        ||
        "Customer";


    try{

        const registration =
            await navigator
            .serviceWorker
            .ready;


        registration.showNotification(
            "💰 Demo Payment Received",
            {

                body:
                    "₹" +
                    money +
                    " received from " +
                    person +
                    "\n" +
                    "DEMO / PRANK — NOT A REAL PAYMENT",

                tag:
                    "payment-demo-" +
                    Date.now(),

                vibrate:
                    [200,100,200],

                requireInteraction:
                    false
            }
        );


    }catch(error){

        console.error(
            "Notification error:",
            error
        );
    }

}


/* =====================================================
   ONE PAYMENT ALERT
===================================================== */

function paymentAlert(){

    /*
      Notification
    */

    notify();


    /*
      Voice
    */

    setTimeout(
        function(){

            speak();

        },
        300
    );

}


/* =====================================================
   START
===================================================== */

async function start(){

    if(running){

        return;
    }


    /*
      IMPORTANT:
      User clicked Start.
      This unlocks audio.
    */

    const audioOK =
        unlockAudio();


    if(!audioOK){

        status.textContent =
            "❌ PC audio could not be activated.";

        return;
    }


    /*
      Notification permission
    */

    if(
        "Notification" in window &&
        Notification.permission !==
        "granted"
    ){

        const permission =
            await Notification.requestPermission();


        if(
            permission !== "granted"
        ){

            status.textContent =
                "❌ Please allow notifications.";

            return;
        }
    }


    running = true;


    startButton.style.display =
        "none";


    stopButton.style.display =
        "block";


    status.textContent =
        "🟢 Alert system started";


    /*
      FIRST ALERT
    */

    paymentAlert();


    secondsLeft =
        Number(
            interval.value
        ) / 1000;


    timer.textContent =
        "Next alert in " +
        secondsLeft +
        " seconds";


    /*
      REPEATED ALERTS
    */

    alertInterval =
        setInterval(
            function(){

                paymentAlert();


                secondsLeft =
                    Number(
                        interval.value
                    ) / 1000;

            },
            Number(
                interval.value
            )
        );


    /*
      COUNTDOWN
    */

    countdownInterval =
        setInterval(
            function(){

                secondsLeft--;


                if(
                    secondsLeft < 0
                ){

                    secondsLeft = 0;

                }


                timer.textContent =
                    "Next alert in " +
                    secondsLeft +
                    " seconds";

            },
            1000
        );

}


/* =====================================================
   STOP
===================================================== */

function stop(){

    running = false;


    clearInterval(
        alertInterval
    );


    clearInterval(
        countdownInterval
    );


    alertInterval = null;

    countdownInterval = null;


    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }


    startButton.style.display =
        "block";


    stopButton.style.display =
        "none";


    timer.textContent =
        "No alerts running";


    status.textContent =
        "🔴 Alerts stopped.";
}


/* =====================================================
   BUTTONS
===================================================== */

startButton.addEventListener(
    "click",
    start
);


stopButton.addEventListener(
    "click",
    stop
);


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
    "serviceWorker" in navigator
){

    navigator.serviceWorker
        .register("sw.js")
        .then(
            function(){

                console.log(
                    "Service Worker registered"
                );

            }
        )
        .catch(
            function(error){

                console.error(
                    "Service Worker error:",
                    error
                );
            }
        );
}


/* =====================================================
   LOAD VOICES
===================================================== */

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        function(){

            console.log(
                "Voices loaded:",
                speechSynthesis
                    .getVoices()
            );
        };
}


/* =====================================================
   INITIAL
===================================================== */

updatePreview();

</script>

</body>
</html>
